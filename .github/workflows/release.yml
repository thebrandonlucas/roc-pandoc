name: Release

# A pull request builds and tests the release under a version that is never
# published: the package's own checks, the examples against the working tree,
# then the exact bundle and examples archive, and the archived examples against
# that bundle. Dispatch from main with a version to publish the same files. The
# shared workflow owns the jobs; this repository owns its package, examples,
# golden tests, notes and Kai tasks.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, such as 0.3.0, or 0.3.0-rc1 for a release candidate; empty runs the dry run"
        type: string
        default: ""
      nightly-tag:
        description: "Exact Roc nightly for a diagnostic run; empty resolves the latest"
        type: string
        default: ""

permissions: {}

jobs:
  Release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # TODO(thebrandonlucas/roc-automation): the fork's release-package.yml with
    # a Kai path beside the Blueprint one: Kai's setup-kai action and `kai run`
    # for every task. Pinned to the head of the fork's kai branch.
    uses: thebrandonlucas/roc-automation/.github/workflows/release-package.yml@19a848eef6e345a671191da6fa6818918c815aa6
    with:
      version: ${{ inputs.version || '' }}
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      check-task: check
      # The golden tests and the directory examples render documents with pandoc.
      setup-command: '["sudo", "apt-get", "install", "-y", "pandoc"]'
